# koyeb.yml
name: chatvista
services:
  - name: chatvista-backend
    git:
      repository: https://github.com/princemaster1/chatvista.git
      branch: main
      root_dir: backend
    build_command: npm install
    run_command: npm start
    env:
      - name: DATABASE_URL
        value: ${DATABASE_URL}
      - name: JWT_SECRET
        value: ${JWT_SECRET}
      - name: OPENAI_API_KEY
        value: ${OPENAI_API_KEY}
    instance_type: F1
    region: oregon
    http_port: 8080

  - name: chatvista-frontend
    git:
      repository: https://github.com/princemaster1/chatvista.git
      branch: main
      root_dir: frontend
    build_command: npm install && npm run build
    run_command: npm run start
    env:
      - name: NEXT_PUBLIC_API_URL
        value: https://chatvista-backend.${KOYEB_APP_SUBDOMAIN}.koyeb.app/api
    instance_type: F1
    region: oregon
    http_port: 3000
