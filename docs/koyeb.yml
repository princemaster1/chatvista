# docs/koyeb.yml
# Example Koyeb app-compose for deploying backend and frontend
version: '1'
services:
  backend:
    name: chatvista-backend
    source:
      type: git
      repo: https://github.com/your-username/chatvista
      path: /backend
    env:
      - name: DATABASE_URL
        secret: DATABASE_URL
      - name: JWT_SECRET
        secret: JWT_SECRET
      - name: OPENAI_API_KEY
        secret: OPENAI_API_KEY
    build:
      install_command: npm install
      build_command: npm run build || true
      start_command: npm start
  frontend:
    name: chatvista-frontend
    source:
      type: git
      repo: https://github.com/your-username/chatvista
      path: /frontend
    env:
      - name: NEXT_PUBLIC_API_URL
        value: https://<your-backend-url>
    build:
      install_command: npm install
      build_command: npm run build
      start_command: npm run start
